# Pull requests are verified, not published.
#
# The iPhone project publishes a preview channel per pull request. This
# project does not: a preview would create extra hosting sites in the shared
# Firebase project, and a broken Android build should never reach a device.

name: Verify Android pull request
on: pull_request
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
