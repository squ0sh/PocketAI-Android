# Android port — deploys ONLY the Android hosting site.
#
# The iPhone project (pocket-ai-iphone) and this project share one Firebase
# project, so this workflow is deliberately narrow: it never touches
# functions, and it never touches the pocket-ai-iphone site.

name: Deploy Android hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: pocket-ai-sovereign-aether
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Write service account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POCKET_AI_SOVEREIGN_AETHER }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/creds/firebase-service-account.json
        run: |
          mkdir -p "$(dirname "$GOOGLE_APPLICATION_CREDENTIALS")"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          node -e '
            const fs = require("fs");
            const raw = fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS, "utf8");
            console.log(`credentials: ${raw.length} bytes`);
            const key = JSON.parse(raw);
            console.log(`credentials: type=${key.type} client_email=${key.client_email} project=${key.project_id}`);
            if (key.type !== "service_account") throw new Error("the secret is not a service account key");
            if (!key.private_key || !key.private_key.includes("BEGIN PRIVATE KEY")) throw new Error("the secret has no usable private key");
          '
      - name: Deploy hosting (pocket-ai-android only)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/creds/firebase-service-account.json
        run: npx firebase-tools@15.28.2 deploy --only hosting:android --project "$FIREBASE_PROJECT_ID" --non-interactive
