# Android port — deploys ONLY the Android hosting site.
#
# The iPhone project (pocket-ai-iphone) and this project share one Firebase
# project, so this workflow is deliberately narrow: it never touches
# functions, and it never touches the pocket-ai-iphone site.

name: Deploy Android hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Write service account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POCKET_AI_SOVEREIGN_AETHER }}
        run: |
          mkdir -p "$RUNNER_TEMP/creds"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/creds/firebase-service-account.json"
      - name: Deploy hosting (pocket-ai-android only)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/creds/firebase-service-account.json
        run: npx firebase-tools@15.28.2 deploy --only hosting:android --project pocket-ai-sovereign-aether
